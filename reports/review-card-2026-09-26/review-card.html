<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="UTF-8" />
<title>Hair By Melissa — Review Card</title>
<style>
  @page { size: A6; margin: 0; }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #ffffff;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  .card {
    width: 105mm;
    height: 148mm;
    margin: 0 auto;
    background: #ffffff;
    border: 1.2mm solid #0B7BA7;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 10mm 8mm;
    text-align: center;
  }

  .headline {
    font-family: Georgia, "Playfair Display", "Times New Roman", serif;
    font-weight: 700;
    font-size: 8.6mm;
    line-height: 1.15;
    color: #0B7BA7;
    margin: 0 0 4mm 0;
  }

  .subline {
    font-size: 4.1mm;
    line-height: 1.4;
    color: #333333;
    margin: 0 0 6mm 0;
    max-width: 82mm;
  }

  .qr-wrap {
    width: 50mm;
    height: 50mm;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    padding: 2mm;
  }

  .qr-wrap svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .qr-url {
    font-size: 3.6mm;
    letter-spacing: 0.02em;
    color: #333333;
    margin: 4mm 0 0 0;
  }

  .footer {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5mm;
  }

  .salon-name {
    font-family: Georgia, "Playfair Display", "Times New Roman", serif;
    font-weight: 700;
    font-size: 5.2mm;
    color: #0B7BA7;
    margin: 0;
  }

  .phone {
    font-size: 4mm;
    color: #333333;
    margin: 0;
  }
</style>
</head>

  <div class="card">
    <div>
      <p class="headline">Loved your hair?</p>
